[package]
name = "zed-kubernetes"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zed_extension_api = "0.7.0"

# The native server lives in its own crate (it is not compiled to WASM).
[workspace]
exclude = ["kube-lsp"]
