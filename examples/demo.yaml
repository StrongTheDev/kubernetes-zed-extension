apiVersion: apps/v1
kind: Deployment
metadata:
  name: zed-demo
  namespace: default
  labels:
    app: zed-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zed-demo
  template:
    metadata:
      labels:
        app: zed-demo
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: zed-demo
  namespace: default
spec:
  selector:
    app: zed-demo
  ports:
    - port: 80
      targetPort: 80
